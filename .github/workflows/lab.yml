name: Accuracy lab

on:
  pull_request:
    paths:
      - lab/**
      - src-tauri/src/core/speedtest.rs
      - src-tauri/src/core/speedtest/**
      - src-tauri/src/core/stats.rs
      - src-tauri/src/core/stats/**
      - src-tauri/src/core/backends/**
      - src-tauri/examples/lab.rs
      - .github/workflows/lab.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CI: true
  DEBIAN_FRONTEND: noninteractive

jobs:
  spike:
    name: Runner capability spike
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install network tools
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends iperf3 ethtool
      - name: Load shaping modules
        run: |
          if ! sudo modprobe -a sch_netem sch_tbf veth; then
            timeout 300 sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe -a sch_netem sch_tbf veth
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          cache: true
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        timeout-minutes: 15
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: stable
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: lab/server -> target
          key: lab
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Check the lab server
        working-directory: lab/server
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
          cargo build --release --locked
      - name: Build the twin page
        run: pnpm lab:twin
      - name: Run the spike
        run: node lab/spike.ts --server lab/server/target/release/weir-lab-server --static lab-out/twin --out lab-out/spike.json
      - name: Preserve spike results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: lab-spike
          path: lab-out/spike.json
          if-no-files-found: ignore
          retention-days: 7
