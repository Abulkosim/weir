name: Homebrew

# Bumps the cask in Abulkosim/homebrew-tap once a release is public (draft assets 404).
# Re-run by hand with: gh workflow run homebrew.yml -f tag=vX.Y.Z
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag, for example v0.4.0
        required: true

permissions:
  contents: read

concurrency:
  group: homebrew
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  cask:
    name: Update Homebrew tap
    if: github.repository == 'Abulkosim/weir' && vars.HOMEBREW_TAP_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require tap key
        env:
          TAP_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          if [[ -z "$TAP_KEY" ]]; then
            echo "Set the HOMEBREW_TAP_DEPLOY_KEY secret or turn off HOMEBREW_TAP_ENABLED."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Abulkosim/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Update and push cask
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Not a release tag: $RELEASE_TAG"
            exit 1
          fi
          if [[ "$(gh release view "$RELEASE_TAG" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" != "false" ]]; then
            echo "$RELEASE_TAG is a draft or prerelease; the tap follows published releases only."
            exit 1
          fi
          gh release download "$RELEASE_TAG" -p SHA256SUMS.txt -D "$RUNNER_TEMP"
          mkdir -p tap/Casks
          [[ -f tap/Casks/weir.rb ]] || cp packaging/homebrew/Casks/weir.rb tap/Casks/weir.rb
          node packaging/homebrew/update-cask.mjs tap/Casks/weir.rb "$RELEASE_TAG" "$RUNNER_TEMP/SHA256SUMS.txt"
          cd tap
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Tap already at ${RELEASE_TAG#v}."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/weir.rb
          git commit -m "weir ${RELEASE_TAG#v}"
          git push
