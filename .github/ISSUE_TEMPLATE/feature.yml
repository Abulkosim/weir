name: Feature request
description: Suggest a change to how Weir tests or shows your connection.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Weir measures connections; it does not change or speed them up. It has no accounts, telemetry, or ads, and never runs tests without asking. Requests outside that scope will be closed.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should Weir show or do? Mockups or redacted screenshots help.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [macOS, Windows, Both]
    validations:
      required: true
